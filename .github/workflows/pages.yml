name: Deploy viewer to GitHub Pages

# The viewer is a static page with the case carried in the URL, so "deploy"
# is just publishing `viewer/dist`. It ships on every push that could change
# what the page renders — which includes `shared/`, since the parser and the
# page renderer both live there.
on:
  push:
    branches: [master]
    paths:
      - "viewer/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a superseded run has nothing worth finishing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # The viewer shares its parser with the extension, so a type error in
      # `shared/` is a broken viewer — worth failing the deploy over.
      - run: npm run typecheck
      - run: npm run build:viewer
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
